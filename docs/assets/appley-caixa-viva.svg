    <path d="M140 236 L266 222 Q271 222 273 228 L291 280 Q294 287 286 291 L179 331 Q169 335 164 326 L137 245 Q135 238 140 236Z" fill="url(#flapLeft)" filter="url(#softShadow)"/>

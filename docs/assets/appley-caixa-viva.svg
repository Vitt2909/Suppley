<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 150 540 540" fill="none">
  <title>Appley — Caixa Viva, versão 2</title>
  <desc>Mascote vetorial de papelão dourado, com lateral esquerda aparente, abas caídas, fita verde-menta, olhos brilhantes e mãos e pés arredondados. Construído com caminhos, gradientes e filtros SVG, sem imagens incorporadas.</desc>
  <defs>
    <linearGradient id="front" x1="171" y1="282" x2="440" y2="552" gradientUnits="userSpaceOnUse"><stop stop-color="#F7CC91"/><stop offset=".4" stop-color="#F3C387"/><stop offset=".78" stop-color="#EAB577"/><stop offset="1" stop-color="#D99B59"/></linearGradient>
    <linearGradient id="side" x1="76" y1="379" x2="183" y2="363" gradientUnits="userSpaceOnUse"><stop stop-color="#BD8446"/><stop offset=".35" stop-color="#D5A062"/><stop offset=".75" stop-color="#DBAA70"/><stop offset="1" stop-color="#B98147"/></linearGradient>
    <linearGradient id="top" x1="224" y1="195" x2="240" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#F8D49F"/><stop offset=".6" stop-color="#F4C790"/><stop offset="1" stop-color="#DEAA6C"/></linearGradient>
    <linearGradient id="flapLeft" x1="169" y1="237" x2="222" y2="326" gradientUnits="userSpaceOnUse"><stop stop-color="#FFDBA7"/><stop offset=".5" stop-color="#F5C98F"/><stop offset="1" stop-color="#E4AC6C"/></linearGradient>
    <linearGradient id="flapRight" x1="371" y1="218" x2="414" y2="311" gradientUnits="userSpaceOnUse"><stop stop-color="#FCD49C"/><stop offset=".62" stop-color="#F1C28B"/><stop offset="1" stop-color="#E4AD71"/></linearGradient>
    <linearGradient id="backFlap" x1="53" y1="268" x2="110" y2="286" gradientUnits="userSpaceOnUse"><stop stop-color="#A86C34"/><stop offset="1" stop-color="#D6A166"/></linearGradient>
    <linearGradient id="tapeTop" x1="224" y1="197" x2="324" y2="228" gradientUnits="userSpaceOnUse"><stop stop-color="#9DDCC6"/><stop offset="1" stop-color="#78CDB7"/></linearGradient>
    <linearGradient id="tapeFront" x1="274" y1="245" x2="348" y2="271" gradientUnits="userSpaceOnUse"><stop stop-color="#8CD7BE"/><stop offset=".52" stop-color="#75C9AE"/><stop offset="1" stop-color="#4AA48B"/></linearGradient>
    <radialGradient id="limb" cx=".3" cy=".18" r=".86"><stop stop-color="#F8CC91"/><stop offset=".48" stop-color="#E9B575"/><stop offset=".82" stop-color="#D49A58"/><stop offset="1" stop-color="#B67B3D"/></radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#AA6E34"/><stop offset=".46" stop-color="#D79C5C"/><stop offset="1" stop-color="#F0BE80"/></linearGradient>
    <radialGradient id="eye" cx=".32" cy=".2" r=".85"><stop stop-color="#554D3C"/><stop offset=".37" stop-color="#2B271E"/><stop offset=".75" stop-color="#171710"/><stop offset="1" stop-color="#3C3120"/></radialGradient>
    <linearGradient id="brow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55462E"/><stop offset="1" stop-color="#28251B"/></linearGradient>
    <radialGradient id="frontLight" cx=".31" cy=".3" r=".8"><stop stop-color="#FFE6BB" stop-opacity=".3"/><stop offset="1" stop-color="#FFE6BB" stop-opacity="0"/></radialGradient>
    <filter id="ground" x="-.3" y="-1" width="1.6" height="3"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softShadow" x="-.4" y="-.4" width="1.8" height="1.9"><feDropShadow dx="1" dy="6" stdDeviation="5" flood-color="#76431D" flood-opacity=".26"/></filter>
    <filter id="smallShadow" x="-.5" y="-.5" width="2" height="2"><feDropShadow dx="0" dy="2" stdDeviation="1.3" flood-color="#875526" flood-opacity=".28"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="paper" x="-.1" y="-.1" width="1.2" height="1.2" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="19" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="grayGrain"/>
      <feComponentTransfer in="grayGrain" result="faintGrain"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feComposite in="faintGrain" in2="SourceGraphic" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="soft-light"/>
    </filter>    <clipPath id="frontClip"><path d="M161 252 Q167 235 193 234 L403 220 Q438 221 443 255 L449 468 Q449 505 414 519 L214 550 Q181 554 166 534 Q154 517 155 483 L151 294 Q150 269 161 252Z"/></clipPath>
